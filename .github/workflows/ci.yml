name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build/lint only — no live DB or paid cloud credentials required in CI.
      DATABASE_URL: postgresql://cdms:cdms@localhost:5432/cdms?schema=public
      AUTH_SECRET: ci-placeholder-auth-secret-not-for-production
      AUTH_URL: http://localhost:3000
      REPORT_CRON_SECRET: ci-placeholder-cron-secret
      REPORT_EMAIL_MODE: console
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
